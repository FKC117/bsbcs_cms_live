{% with current_url=request.resolver_match.url_name event_query=current_filters.event %}
<nav class="flex max-w-full flex-wrap items-center justify-end gap-2" aria-label="Dashboard shortcuts">
    <a href="{% url 'global_dashboard' %}" class="rounded-lg border px-3 py-2 text-sm font-semibold shadow-sm transition {% if current_url == 'global_dashboard' %}border-white bg-white text-bsbcs-navy{% else %}border-white/25 text-white/90 hover:bg-white/10{% endif %}">Dashboard</a>
    <a href="{% url 'dashboard_event_builder' %}" class="hidden rounded-lg border px-3 py-2 text-sm font-semibold shadow-sm transition sm:inline-flex {% if current_url == 'dashboard_event_builder' %}border-white bg-white text-bsbcs-navy{% else %}border-white/25 text-white/90 hover:bg-white/10{% endif %}">Create event</a>
    <a href="{% url 'dashboard_program_session_builder' %}{% if event_query %}?event={{ event_query }}{% endif %}" class="hidden rounded-lg border px-3 py-2 text-sm font-semibold shadow-sm transition md:inline-flex {% if current_url == 'dashboard_program_session_builder' %}border-white bg-white text-bsbcs-navy{% else %}border-white/25 text-white/90 hover:bg-white/10{% endif %}">Program builder</a>
    <a href="{% url 'dashboard_participant_center' %}{% if event_query %}?event={{ event_query }}{% endif %}" class="hidden rounded-lg border px-3 py-2 text-sm font-semibold shadow-sm transition lg:inline-flex {% if current_url == 'dashboard_participant_center' %}border-white bg-white text-bsbcs-navy{% else %}border-white/25 text-white/90 hover:bg-white/10{% endif %}">Participants</a>
    <a href="{% url 'dashboard_payment_center' %}{% if event_query %}?event={{ event_query }}{% endif %}" class="hidden rounded-lg border px-3 py-2 text-sm font-semibold shadow-sm transition xl:inline-flex {% if current_url == 'dashboard_payment_center' %}border-white bg-white text-bsbcs-navy{% else %}border-white/25 text-white/90 hover:bg-white/10{% endif %}">Payments</a>

    <details class="group relative">
        <summary class="flex cursor-pointer list-none items-center gap-2 rounded-lg border px-3 py-2 text-sm font-semibold shadow-sm transition marker:hidden {% if current_url == 'dashboard_corporate_center' or current_url == 'dashboard_registration_kit_center' or current_url == 'dashboard_bulk_email_center' or current_url == 'dashboard_abstract_center' or current_url == 'dashboard_certificate_center' %}border-white bg-white text-bsbcs-navy{% else %}border-white/25 text-white/90 hover:bg-white/10{% endif %}">
            More
            <span class="text-xs transition group-open:rotate-180">v</span>
        </summary>
        <div class="absolute right-0 z-50 mt-2 w-64 overflow-hidden rounded-2xl border border-line bg-white p-2 text-ink shadow-lift">
            <a href="{% url 'dashboard_corporate_center' %}{% if event_query %}?event={{ event_query }}{% endif %}" class="block rounded-xl px-3 py-2 text-sm font-black {% if current_url == 'dashboard_corporate_center' %}bg-blue-50 text-bsbcs-blue{% else %}text-slate-700 hover:bg-slate-50{% endif %}">Corporate management</a>
            <a href="{% url 'dashboard_registration_kit_center' %}{% if event_query %}?event={{ event_query }}{% endif %}" class="block rounded-xl px-3 py-2 text-sm font-black {% if current_url == 'dashboard_registration_kit_center' %}bg-blue-50 text-bsbcs-blue{% else %}text-slate-700 hover:bg-slate-50{% endif %}">Issue Kit</a>
            <a href="{% url 'dashboard_bulk_email_center' %}" class="block rounded-xl px-3 py-2 text-sm font-black {% if current_url == 'dashboard_bulk_email_center' %}bg-blue-50 text-bsbcs-blue{% else %}text-slate-700 hover:bg-slate-50{% endif %}">Bulk email</a>
            <a href="{% url 'dashboard_abstract_center' %}{% if event_query %}?event={{ event_query }}{% endif %}" class="block rounded-xl px-3 py-2 text-sm font-black {% if current_url == 'dashboard_abstract_center' %}bg-blue-50 text-bsbcs-blue{% else %}text-slate-700 hover:bg-slate-50{% endif %}">Abstracts approval</a>
            <a href="{% url 'dashboard_certificate_center' %}{% if event_query %}?event={{ event_query }}{% endif %}" class="block rounded-xl px-3 py-2 text-sm font-black {% if current_url == 'dashboard_certificate_center' %}bg-blue-50 text-bsbcs-blue{% else %}text-slate-700 hover:bg-slate-50{% endif %}">Certificates</a>
            <div class="my-2 border-t border-line"></div>
            <a href="{% url 'admin:index' %}" target="_blank" rel="noopener noreferrer" class="block rounded-xl bg-bsbcs-navy px-3 py-2 text-sm font-black text-white hover:bg-slate-800">Django Admin</a>
        </div>
    </details>
</nav>
{% endwith %}
