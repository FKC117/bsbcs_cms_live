{% with current_url=request.resolver_match.url_name event_query=current_filters.event %}
<nav class="flex max-w-full items-center gap-2 overflow-x-auto pb-1 [-ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden" aria-label="Dashboard shortcuts">
    <a href="{% url 'global_dashboard' %}" class="shrink-0 rounded-lg border px-3 py-2 text-sm font-semibold shadow-sm transition {% if current_url == 'global_dashboard' %}border-white bg-white text-bsbcs-navy{% else %}border-white/25 text-white/90 hover:bg-white/10{% endif %}">Dashboard</a>
    <a href="{% url 'dashboard_event_builder' %}" class="shrink-0 rounded-lg border px-3 py-2 text-sm font-semibold shadow-sm transition {% if current_url == 'dashboard_event_builder' %}border-white bg-white text-bsbcs-navy{% else %}border-white/25 text-white/90 hover:bg-white/10{% endif %}">Create event</a>
    <a href="{% url 'dashboard_program_session_builder' %}{% if event_query %}?event={{ event_query }}{% endif %}" class="shrink-0 rounded-lg border px-3 py-2 text-sm font-semibold shadow-sm transition {% if current_url == 'dashboard_program_session_builder' %}border-white bg-white text-bsbcs-navy{% else %}border-white/25 text-white/90 hover:bg-white/10{% endif %}">Program builder</a>
    <a href="{% url 'dashboard_participant_center' %}{% if event_query %}?event={{ event_query }}{% endif %}" class="shrink-0 rounded-lg border px-3 py-2 text-sm font-semibold shadow-sm transition {% if current_url == 'dashboard_participant_center' %}border-white bg-white text-bsbcs-navy{% else %}border-white/25 text-white/90 hover:bg-white/10{% endif %}">Participants management</a>
    <a href="{% url 'dashboard_payment_center' %}{% if event_query %}?event={{ event_query }}{% endif %}" class="shrink-0 rounded-lg border px-3 py-2 text-sm font-semibold shadow-sm transition {% if current_url == 'dashboard_payment_center' %}border-white bg-white text-bsbcs-navy{% else %}border-white/25 text-white/90 hover:bg-white/10{% endif %}">Payments Management</a>
    <a href="{% url 'dashboard_corporate_center' %}{% if event_query %}?event={{ event_query }}{% endif %}" class="shrink-0 rounded-lg border px-3 py-2 text-sm font-semibold shadow-sm transition {% if current_url == 'dashboard_corporate_center' %}border-white bg-white text-bsbcs-navy{% else %}border-white/25 text-white/90 hover:bg-white/10{% endif %}">Corporate management</a>
    <a href="{% url 'dashboard_registration_kit_center' %}{% if event_query %}?event={{ event_query }}{% endif %}" class="shrink-0 rounded-lg border px-3 py-2 text-sm font-semibold shadow-sm transition {% if current_url == 'dashboard_registration_kit_center' %}border-white bg-white text-bsbcs-navy{% else %}border-white/25 text-white/90 hover:bg-white/10{% endif %}">Issue Kit</a>
    <a href="{% url 'dashboard_bulk_email_center' %}" class="shrink-0 rounded-lg border px-3 py-2 text-sm font-semibold shadow-sm transition {% if current_url == 'dashboard_bulk_email_center' %}border-white bg-white text-bsbcs-navy{% else %}border-white/25 text-white/90 hover:bg-white/10{% endif %}">Bulk email</a>
    <a href="{% url 'dashboard_abstract_center' %}{% if event_query %}?event={{ event_query }}{% endif %}" class="shrink-0 rounded-lg border px-3 py-2 text-sm font-semibold shadow-sm transition {% if current_url == 'dashboard_abstract_center' %}border-white bg-white text-bsbcs-navy{% else %}border-white/25 text-white/90 hover:bg-white/10{% endif %}">Abstracts approval</a>
    <a href="{% url 'dashboard_certificate_center' %}{% if event_query %}?event={{ event_query }}{% endif %}" class="shrink-0 rounded-lg border px-3 py-2 text-sm font-semibold shadow-sm transition {% if current_url == 'dashboard_certificate_center' %}border-white bg-white text-bsbcs-navy{% else %}border-white/25 text-white/90 hover:bg-white/10{% endif %}">Certificates</a>
    <a href="{% url 'admin:index' %}" target="_blank" rel="noopener noreferrer" class="shrink-0 rounded-lg bg-white px-3 py-2 text-sm font-bold text-bsbcs-navy shadow-sm transition hover:bg-slate-100">Django Admin</a>
</nav>
{% endwith %}
